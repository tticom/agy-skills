name: Validate harness manifests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate generated Codex and AGY manifests
        run: |
          python3 scripts/sync-harness-manifests.py --check
          python3 -m py_compile scripts/sync-harness-manifests.py
